name: VIX Probe (臺指VIX 資料來源探測)

# 2026-11-19:一次性探測 + 驗證 GAS VixMood.js 純計算(只印 log,不 commit)。
on:
  pull_request:
    paths:
      - vix_probe.py
      - vix_mood_check/**
      - .github/workflows/vix-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node vix_mood_check/check.js
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
