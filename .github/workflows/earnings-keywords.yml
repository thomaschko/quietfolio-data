name: Earnings Keywords (季度)

on:
  workflow_dispatch:          # 手動觸發(法說季才跑)
  schedule:
    - cron: '0 2 * * 1'       # 每週一 UTC02:00 跑一次(省API額度)

permissions:
  contents: write

jobs:
  earnings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install requests
      - name: Run earnings keywords
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: python earnings_keywords.py
      - name: Commit result
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add earnings_keywords.json || true
          if git diff --staged --quiet; then
            echo "無變更"
          else
            git commit -m "Earnings keywords $(date -u +%Y-%m-%d)"
            git push
          fi
