name: TPEx IC Probe (一次性探測)

# 2026-10-21 一次性:ic.tpex.org.tw 產業價值鏈資訊平台能否取得「產業→上中下游→公司」對照。只手動執行、不 commit,
# 結果 tpex_ic_probe_result.json 以 artifact 上傳並印在 log。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Run probe
        run: python tpex_ic_probe.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpex_ic_probe_result
          path: tpex_ic_probe_result.json
          if-no-files-found: warn
