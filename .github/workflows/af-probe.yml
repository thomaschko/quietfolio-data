name: AF Probe (反脆弱資料來源探測)

# 2026-11-23:一次性探測(只印 log,不 commit)。
on:
  pull_request:
    paths:
      - af_probe.py
      - .github/workflows/af-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python af_probe.py
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
