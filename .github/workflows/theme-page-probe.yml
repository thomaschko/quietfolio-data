name: Theme Page Probe (題材頁面 Phase 0 探測)

# 2026-11-09:只讀探測,結果只印到 job log(不 commit、不存檔)。只能手動觸發。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Probe
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python theme_page_probe.py
