name: AV SPCX Transcript Probe (SpaceX 逐字稿驗證)

# 2026-11-17:一次性驗證 SPCX 在 Alpha Vantage 是否有法說逐字稿(1 次呼叫,只印計數,不 commit)。
on:
  pull_request:
    paths:
      - av_spcx_probe.py
      - .github/workflows/av-spcx-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python av_spcx_probe.py
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
