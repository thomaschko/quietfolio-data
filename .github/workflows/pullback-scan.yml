name: Pullback Daily Scan (急跌反轉每日掃描)

# 用回測同一套條件掃描今日前200大成交值股票池,輸出 pullback_signals.json,
# Apps Script(PullbackFetch.js)每小時讀取 → 網頁「找股票 → 急跌反轉」。
# 排程:平日 UTC 07:10 = 台北 15:10(收盤後);GitHub 排程常延誤,GAS 端每小時輪詢。
on:
  schedule:
    - cron: '10 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install yfinance pandas numpy requests

      - name: Unit tests
        run: |
          python test_pullback_backtest.py
          python test_pullback_scan.py

      - name: Scan today
        run: python pullback_scan.py

      - name: Commit signals
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add pullback_signals.json
          if git diff --staged --quiet; then
            echo "無變更"
          else
            git commit -m "Pullback scan $(TZ=Asia/Taipei date +%Y-%m-%d)"
            BR="${GITHUB_REF_NAME}"
            for i in 1 2 3; do
              git pull --rebase origin "$BR" && git push origin "HEAD:$BR" && exit 0
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            echo "推送失敗(重試3次)"; exit 1
          fi
