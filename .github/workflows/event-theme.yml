name: Event Theme Radar

# 每天盤後跑一次(台北 17:00 → UTC 09:00)
# 2026-09-21修正:原本只在交易日(週一到週五)跑,假設是「沒開盤就不用跑」,
# 但題材新聞討論(尤其國際法說、國際媒體)不會因為台股休市而停止,週末
# 不跑會在theme_history留下缺口,連帶讓theme_tracker.py的連續天數計算
# (逐日往回比對,遇到缺資料的日期就視為中斷)在每個週一被錯誤重置——
# 不是題材真的斷了,是資料本身缺了兩天。改成每天都跑,從源頭解決,
# 不用在下游的連續天數邏輯裡另外容忍缺口。
# 2026-10-06修正:原本16:30觸發,但實測TWSE/TPEx STOCK_DAY_ALL/
# tpex_mainboard_daily_close_quotes在16:03還是前一天的資料,約17:12
# 才更新成當天——16:30跑price_stage.py抓到的常是舊的一天。整條流程
# (radar→...→price_stage)約需25分鐘,改17:00觸發,price_stage實際
# 抓價約落在17:20前後,在17:12已更新之後,留有餘裕。
on:
  schedule:
    - cron: '0 9 * * *'   # 每天 UTC 09:00 = 台北 17:00
  workflow_dispatch:          # 允許手動觸發測試

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          pip install requests jieba
          pip install --upgrade certifi  # 2026-09-14:修TPEx SSL憑證驗證失敗
          # (unable to get local issuer certificate),通常是runner的CA憑證包過期

      # 主雷達:src1鉅亨暴增 + src2 MOPS + src3維基關注度
      - name: Run radar
        id: radar
        run: python event_theme_radar.py

      # 偵測源4a:新題材發現 jieba跨源版(獨立產出,出錯不擋主流程)
      # 2026-09-23新增:同日多源爆量的熱詞查詢機制也需要GEMINI_API_KEY
      # (之前漏加,導致「iPhone」「貝森特」等熱詞查詢失敗,已修正)。
      - name: Run new theme discovery
        id: new_theme
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python new_theme_discovery.py

      # 偵測源4b:AI語意版新題材發現(Gemini被動萃取,從收集到的新聞裡找題材)
      - name: Run AI theme discovery
        id: ai_theme
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ai_theme_discovery.py

      # 偵測源4c:Gemini主動搜尋(2026-09-11新增)
      # 偵測源4c:Gemini主動搜尋 — 已移至獨立週排程(gemini-active-search.yml,每週五盤後)
      # 原因:Search Grounding額度遠比一般文字生成嚴格(每日文字生成7/500,但grounding
      # 疊加每日其他Gemini呼叫容易撞429),且「新興題材」本來就不需要天天查,改每週一次。

      # 題材追蹤:整合三個候選來源(主動搜尋+AI萃取+jieba),分辨今日首見vs連續追蹤中
      # 含自動升格進watchlist、國際大廠反查自動升格進src6(都需GEMINI_API_KEY)
      - name: Track theme history
        id: theme_tracker
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python theme_tracker.py

      # 每日摘要整合:匯整 src1-6 輸出成 daily_digest.json(A-G區)
      # 價量階段標籤(2026-10-06新增):抓全市場收盤價+成交量存快照,
      # 給每檔雷達股票標「潛伏/啟動/過熱」。放在digest之前,digest會讀它。
      - name: Price stage snapshot
        id: price_stage
        continue-on-error: true
        run: python price_stage.py

      - name: Build daily digest
        id: digest
        continue-on-error: true
        run: python daily_digest.py

      # 每日題材研究報告(2026-09-23補接:這支腳本早就寫好、完整可用,
      # 讀daily_digest.json+theme_tracker.json(已整合全部24源資料),
      # 用Gemini產出一篇700-1000字繁中研究報告,但先前從未被接進任何
      # workflow執行過,一直是死程式碼。這次補上,讓它真正每天執行。
      - name: Generate daily research report
        id: report
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python daily_report.py

      # 驗證中心(2026-09-21新增):A區/D區標記的股票自動記claim,
      # 30天後回頭比對真實收盤價,自動判✅印證/❌反駁,累積後可按
      # 偵測類型(題材群聚/跨來源共振/關鍵字暴增)分開統計命中率。
      - name: Update verification ledger
        id: ledger
        continue-on-error: true
        run: python verification_ledger.py

      # 美股8-K重訊(2026-09-22新增):對照MOPS重訊(src2)的美股版,用
      # SEC EDGAR官方免費API(不需key),對現有23家追蹤公司抓最近7天
      # 內的8-K申報,即時性比季度才跑一次的earnings_keywords.py高——
      # 事件觸發、4個工作天內必須申報,不用等法說會才知道。
      - name: Track US 8-K material events
        id: us8k
        continue-on-error: true
        run: python us_8k_events.py

      # 管線狀態記錄(2026-10-06新增):上面每個步驟都是continue-on-error,
      # 單一步驟失敗不會讓workflow顯示紅字——這一步把每個步驟的真實結果
      # 寫進daily_digest.json的pipeline_status欄位,並且在digest.date不是
      # 今天(UTC)時讓這個步驟本身失敗,使這次run在GitHub Actions介面上
      # 顯示失敗,不再靜默吃掉「資料其實是舊的」這件事。故意不加
      # continue-on-error,讓它是整個workflow裡唯一「真的會讓run變紅」的
      # 檢查點;下面的commit步驟用if: always()確保狀態仍會被記錄並推送,
      # 不會因為這一步失敗就漏commit。
      - name: Record pipeline status
        id: pipeline_status
        if: always()
        env:
          STEP_RADAR: ${{ steps.radar.outcome }}
          STEP_NEW_THEME: ${{ steps.new_theme.outcome }}
          STEP_AI_THEME: ${{ steps.ai_theme.outcome }}
          STEP_THEME_TRACKER: ${{ steps.theme_tracker.outcome }}
          STEP_PRICE_STAGE: ${{ steps.price_stage.outcome }}
          STEP_DIGEST: ${{ steps.digest.outcome }}
          STEP_REPORT: ${{ steps.report.outcome }}
          STEP_LEDGER: ${{ steps.ledger.outcome }}
          STEP_US8K: ${{ steps.us8k.outcome }}
        run: python record_pipeline_status.py

      - name: Commit and push
        if: always()
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add event_theme_raw.json 2>/dev/null || true
          [ -f new_theme_candidates.json ] && git add new_theme_candidates.json || true
          [ -f ai_theme_candidates.json ] && git add ai_theme_candidates.json || true
          [ -f gemini_search_candidates.json ] && git add gemini_search_candidates.json || true
          [ -f theme_tracker.json ] && git add theme_tracker.json || true
          git add theme_history/ 2>/dev/null || true
          git add price_history/ 2>/dev/null || true
          [ -f price_stage.json ] && git add price_stage.json || true
          git add company_history/ 2>/dev/null || true
          [ -f theme_promotions.json ] && git add theme_promotions.json || true
          [ -f themes_watchlist.txt ] && git add themes_watchlist.txt || true
          [ -f earnings_keywords.py ] && git add earnings_keywords.py || true
          [ -f us_8k_events.json ] && git add us_8k_events.json || true
          [ -f daily_digest.json ] && git add daily_digest.json || true
          [ -f daily_report.json ] && git add daily_report.json || true
          [ -f verification_ledger.json ] && git add verification_ledger.json || true
          if git diff --staged --quiet; then
            echo "無變更,不 commit"
          else
            git commit -m "Daily radar + digest $(date -u +%Y-%m-%d)"
            git pull --rebase origin main || true
            git push
          fi
