name: Event Theme Radar

# 每個交易日盤後跑一次(台北 16:30 → UTC 08:30)
on:
  schedule:
    - cron: '30 8 * * 1-5'   # 週一到週五 UTC 08:30 = 台北 16:30
  workflow_dispatch:          # 允許手動觸發測試

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests jieba

      # 主雷達:src1鉅亨暴增 + src2 MOPS + src3維基關注度
      - name: Run radar
        run: python event_theme_radar.py

      # 偵測源4a:新題材發現 jieba跨源版(獨立產出,出錯不擋主流程)
      - name: Run new theme discovery
        continue-on-error: true
        run: python new_theme_discovery.py

      # 偵測源4b:AI語意版新題材發現(Gemini被動萃取,從收集到的新聞裡找題材)
      - name: Run AI theme discovery
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ai_theme_discovery.py

      # 偵測源4c:Gemini主動搜尋(2026-09-11新增)
      # 跟4b不同:直接問Gemini+Google Search grounding即時上網搜尋台美日股上升關鍵字,
      # 不受限於我們自己收集的新聞池範圍(解決NPO案例暴露的「新聞池沒收到就看不到」問題)
      - name: Run Gemini active search
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python gemini_active_search.py

      # 題材追蹤:整合三個候選來源(主動搜尋+AI萃取+jieba),分辨今日首見vs連續追蹤中
      # 含自動升格進watchlist、國際大廠反查自動升格進src6(都需GEMINI_API_KEY)
      - name: Track theme history
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python theme_tracker.py

      # 每日摘要整合:匯整 src1-6 輸出成 daily_digest.json(A-G區)
      - name: Build daily digest
        continue-on-error: true
        run: python daily_digest.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add event_theme_raw.json 2>/dev/null || true
          [ -f new_theme_candidates.json ] && git add new_theme_candidates.json || true
          [ -f ai_theme_candidates.json ] && git add ai_theme_candidates.json || true
          [ -f gemini_search_candidates.json ] && git add gemini_search_candidates.json || true
          [ -f theme_tracker.json ] && git add theme_tracker.json || true
          git add theme_history/ 2>/dev/null || true
          git add company_history/ 2>/dev/null || true
          [ -f theme_promotions.json ] && git add theme_promotions.json || true
          [ -f themes_watchlist.txt ] && git add themes_watchlist.txt || true
          [ -f earnings_keywords.py ] && git add earnings_keywords.py || true
          [ -f daily_digest.json ] && git add daily_digest.json || true
          if git diff --staged --quiet; then
            echo "無變更,不 commit"
          else
            git commit -m "Daily radar + digest $(date -u +%Y-%m-%d)"
            git pull --rebase origin main || true
            git push
          fi
