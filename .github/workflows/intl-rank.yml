name: Intl Rank (美/日/韓成交值排行)

# 2026-10-19 新增。intl_rank.py → intl_rank.json → GAS IntlRankFetch.js → 排行榜頁「美股/日股/韓股」
# 之後 group_flow.py → group_flow.json(族群金流共識)→ 同一個 GAS 讀取 → 排行榜頁「族群金流」
# 排程(UTC):
#   14:00 週一~五 = 台北 22:00 → 只跑日股、韓股(兩地當日已收盤)
#   23:30 週一~五 = 台北 07:30(週二~週六)→ 跑美股(美股前一交易日已收盤);日韓資料日落後才補跑(--catchup)
# 其餘市場沿用舊資料並標 stale(intl_rank_core.merge_preserve)。
on:
  schedule:
    - cron: '0 14 * * 1-5'
    - cron: '30 23 * * 1-5'
  workflow_dispatch:
    inputs:
      markets:
        description: '市場(逗號分隔:us,jp,kr)'
        default: 'us,jp,kr'
        required: false

concurrency:
  group: intl-rank
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install yfinance pandas numpy openpyxl lxml requests pytest

      # 單元測試失敗就中止,不產生資料
      - name: Unit tests
        run: python -m pytest -q test_intl_rank_core.py test_intl_rank.py test_group_flow.py

      # 族群金流共識(Phase 1.5):intl_theme_baskets.json 的籃子 × 台美日韓,只抓籃子成分股(約 280 檔)。
      # 2026-10-20 移到排行榜之前:排行榜一次抓幾千檔後 Yahoo 會限流(Too Many Requests),族群籃子會缺一大半。
      # 失敗不影響排行榜的 commit。
      - name: Group money-flow consensus
        continue-on-error: true
        run: python group_flow.py

      - name: Build rankings
        env:
          INTL_BUDGET_MIN: '25'
        run: |
          CATCH=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # 2026-10-22:早上美股那次順便檢查日韓,資料日落後(晚上那次延到半夜、撞上 Yahoo 前一日收盤價空窗)才補跑
            if [ "${{ github.event.schedule }}" = "0 14 * * 1-5" ]; then MK="jp,kr"; else MK="us"; CATCH="jp,kr"; fi
          else
            MK="${{ github.event.inputs.markets || 'us,jp,kr' }}"
          fi
          echo "markets=$MK catchup=$CATCH"
          python intl_rank.py --markets "$MK" --catchup "$CATCH"

      - name: Commit and push
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add intl_rank.json
          [ -f intl_market_totals.json ] && git add intl_market_totals.json || true
          [ -f group_flow.json ] && git add group_flow.json || true
          if git diff --staged --quiet; then
            echo "無變更,不 commit"
            exit 0
          fi
          git commit -m "Intl rank $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push 失敗,第 $i 次重試"; sleep $((i * 10))
          done
          exit 1
