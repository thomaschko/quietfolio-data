name: Intl Rank (美/日/韓成交值排行)

# 2026-10-19 新增。intl_rank.py → intl_rank.json → GAS IntlRankFetch.js → 排行榜頁「美股/日股/韓股」
# 排程(UTC):
#   14:00 週一~五 = 台北 22:00 → 只跑日股、韓股(兩地當日已收盤)
#   23:30 週一~五 = 台北 07:30(週二~週六)→ 只跑美股(美股前一交易日已收盤)
# 其餘市場沿用舊資料並標 stale(intl_rank_core.merge_preserve)。
on:
  schedule:
    - cron: '0 14 * * 1-5'
    - cron: '30 23 * * 1-5'
  workflow_dispatch:
    inputs:
      markets:
        description: '市場(逗號分隔:us,jp,kr)'
        default: 'us,jp,kr'
        required: false

concurrency:
  group: intl-rank
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install yfinance pandas numpy openpyxl lxml requests pytest

      # 單元測試失敗就中止,不產生資料
      - name: Unit tests
        run: python -m pytest -q test_intl_rank_core.py test_intl_rank.py

      - name: Build rankings
        env:
          INTL_BUDGET_MIN: '25'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 14 * * 1-5" ]; then MK="jp,kr"; else MK="us"; fi
          else
            MK="${{ github.event.inputs.markets || 'us,jp,kr' }}"
          fi
          echo "markets=$MK"
          python intl_rank.py --markets "$MK"

      - name: Commit and push
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add intl_rank.json
          if git diff --staged --quiet; then
            echo "無變更,不 commit"
            exit 0
          fi
          git commit -m "Intl rank $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push 失敗,第 $i 次重試"; sleep $((i * 10))
          done
          exit 1
