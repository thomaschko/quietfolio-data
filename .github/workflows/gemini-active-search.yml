name: Gemini Active Search (每週五) — 已停用

# 2026-09-11:此功能因免費帳號的 Google Search Grounding 額度異常受限
# (單次呼叫即429,非用量堆疊問題)而停用。保留檔案供未來額度問題解決後
# 重新啟用參考。目前題材發現已由 AI萃取版(ai_theme_discovery.py,一般文字
# 生成,額度充足)+ jieba版 + 鉅亨美股分類 + CNBC/Yahoo 涵蓋,足以應對
# 大部分「不受限watchlist」的新題材發掘需求。
#
# 若未來想重新啟用:
#   1. 確認 Google AI Studio 帳號的 Grounding 額度狀態
#      (aistudio.google.com/billing 的 Rate Limit 頁面)
#   2. 把下面的 on: 區塊取消註解
#   3. gemini_active_search.py 本身不用改,邏輯已是合併單次呼叫版本

on:
  workflow_dispatch:   # 只保留手動觸發,不自動排程(避免每週固定跑一次都失敗)
  # schedule:
  #   - cron: '30 9 * * 5'

permissions:
  contents: write

jobs:
  active_search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install requests
      - name: Run Gemini active search
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python gemini_active_search.py
      - name: Commit and push
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          [ -f gemini_search_candidates.json ] && git add gemini_search_candidates.json || true
          if git diff --staged --quiet; then
            echo "無變更,不 commit"
          else
            git commit -m "Weekly Gemini active search $(date -u +%Y-%m-%d)"
            git pull --rebase origin main || true
            git push
          fi
