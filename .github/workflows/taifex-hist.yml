name: TAIFEX History (期交所期貨 / 選擇權)

# 2026-11-04 共識頁 Phase 1。三大法人期貨(TX/MTX/TMF)、選擇權買賣權(TXO)、期貨未平倉、Put/Call Ratio、大額交易人。
# 第一次執行回補 2024-08 起(按月);之後每天只重抓本月與上月。間隔 3 秒、遇擋即停、不重試(連線中斷等 60 秒重抓 1 次)。
on:
  schedule:
    - cron: '40 8 * * 1-5'    # 台北 16:40(期交所盤後資料約 15:00~16:00 公布)
    - cron: '10 13 * * 1-5'   # 台北 21:10(備援;GitHub 排程常延遲)
  workflow_dispatch:

permissions:
  contents: write

concurrency: taifex-hist

jobs:
  taifex:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Fetch
        id: fetch
        run: |
          set +e
          python taifex_hist.py
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Consensus (共識頁)
        if: always()
        continue-on-error: true
        run: python consensus.py

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -d taifex_hist ] && git add taifex_hist
          [ -f consensus.json ] && git add consensus.json
          if git diff --cached --quiet; then echo "沒有變更"; else
            git commit -q -m "TAIFEX history update (rc=${{ steps.fetch.outputs.rc }})"
            ok=0
            for i in 1 2 3 4; do
              git pull --rebase -q origin main && git push -q origin HEAD:main && ok=1 && break
              sleep $((2**i))
            done
            [ $ok -eq 1 ] || exit 1
          fi
          [ "${{ steps.fetch.outputs.rc }}" = "0" ] || exit 1
