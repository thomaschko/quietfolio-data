name: Pullback Backtest Phase 2 (手動觸發)

# Phase 2:不事後挑選的股票池(前60日平均成交值前N名)、固定參數重跑,
# 與 Phase 1 五檔並列比較。結果寫進觸發分支的 backtest_out/。
on:
  workflow_dispatch:
    inputs:
      start:
        description: '起始日'
        default: '2019-01-01'
      top:
        description: '股票池大小(逗號分隔)'
        default: '100,200'

permissions:
  contents: write

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install yfinance pandas numpy requests

      - name: Unit tests
        run: |
          python test_pullback_backtest.py
          python test_pullback_phase2.py

      - name: Run Phase 2
        run: python pullback_phase2.py --start "${{ github.event.inputs.start }}" --top "${{ github.event.inputs.top }}"

      - name: Commit results
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add backtest_out/ || true
          if git diff --staged --quiet; then
            echo "無結果變更"
          else
            git commit -m "Pullback backtest phase2 $(date -u +%Y-%m-%d)"
            BR="${GITHUB_REF_NAME}"
            for i in 1 2 3; do
              git pull --rebase origin "$BR" && git push origin "HEAD:$BR" && exit 0
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            echo "推送失敗(重試3次)"; exit 1
          fi
