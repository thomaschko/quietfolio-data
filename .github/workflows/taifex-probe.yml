name: TAIFEX Probe (期交所資料一次性探測)

# 2026-11-04 共識頁 Phase 0:期交所期貨 / 選擇權資料(三大法人、微臺、PCR、大額交易人)可得性與限流,只查不存。只手動執行。

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: taifex-probe

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Run probe
        run: python taifex_probe.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taifex_probe_result
          path: taifex_probe_result.json
          if-no-files-found: warn

      - name: Commit result
        if: always()
        run: |
          [ -f taifex_probe_result.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add taifex_probe_result.json
          git diff --cached --quiet && exit 0
          git commit -m "TAIFEX probe result"
          for i in 1 2 3 4; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((2**i))
          done
          exit 1
